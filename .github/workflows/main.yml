name: Deploy Application

on:
  push:
    branches:
      - main   # Se ejecuta cuando haces push a la rama main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Instalar Node.js (puedes cambiar la versión según tu proyecto)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm install

      # 4. Construir proyecto
      - name: Build project
        run: npm run build

      # 5. Desplegar (ejemplo con Render usando API key)
      - name: Deploy to Render
        run: |
          curl -X POST https://api.render.com/deploy/srv-xxxxxxxx?key=${{ secrets.RENDER_API_KEY }}
